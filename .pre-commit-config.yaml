# Hooks without an explicit stage run at every stage in pre-commit 3.x, which made
# the scaffold's commit-stage checks fire during commit-msg. Pin the default.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=2000]
      - id: check-merge-conflict

  # Local guards. Both exist because of a real incident: commit 3c16231 described a
  # change control entry its patch script had failed to write, and the commit proceeded
  # anyway. See each script's docstring for what it does and does not catch.
  - repo: local
    hooks:
      - id: change-control-entry
        name: new identifier requires a docs/13 entry (NFR-007, TC-107)
        entry: python scripts/check_change_control.py
        language: system
        stages: [commit-msg]
        always_run: true
      - id: commit-message-claims
        name: commit message must not claim untouched documents
        entry: python scripts/check_commit_message_docs.py
        language: system
        stages: [commit-msg]
        always_run: true
