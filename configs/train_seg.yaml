# Segmentation training configuration.
# Determinism is a hard requirement (CLAUDE.md rule 4): the seed here is
# recorded into every run directory alongside the resolved config.

run:
  name: null            # set on the command line; run dir is artifacts/runs/<name>
  seed: 20260916
  deterministic: true

data:
  config: configs/data.yaml
  fold: configs/folds/spectralis_holdout.yaml
  mode: "2d"            # 2d | 2.5d — full 3D is explicitly out of scope
  slice_context: 1      # B-scans either side, used only when mode == 2.5d
  roi_size: [576, 512]   # (axial, lateral) after resampling — see preprocessing below

  preprocessing:
    # SRS-072: DECLARED constants. Never derived from the data at run time, because a
    # target computed from whichever volumes are in the fold would make preprocessing
    # depend on fold membership and stop being comparable across folds.

    # Axial target, millimetres per pixel. SRS-073: the axial axis ONLY. Lateral spacing
    # is ~0.0117 mm in all three vendors and is left alone; B-scan separation is not used
    # by the transform chain at all, because training is 2D and frames are independent.
    #
    # 0.004 is the COARSEST choice, deliberately. Every observed axial spacing is at or
    # below it (cirrus 0.001955, topcon 0.0026-0.0035, spectralis 0.003872), so no volume
    # is ever upsampled. Downsampling discards information; upsampling fabricates it, and
    # fabricated detail would substitute a smoothness signature for the brightness
    # signature the normalisation removes. Rounding to 0.004 rather than to spectralis's
    # 0.003872 also means no single vendor passes through untouched.
    #
    # Resulting heights: cirrus 500, spectralis 480, topcon 422/569/575 -- all below the
    # 576 roi_size above, so the chain pads and never crops.
    axial_spacing_mm: 0.004

    # SRS-070: per-volume percentile window, computed at ingestion on the RAW volume and
    # stored on the record. These are the percentiles that define it. Clipping is
    # required, not optional: spectralis saturates at exactly 65535 and p99 is ~48000.
    intensity_percentiles: [1.0, 99.0]
  cache: persistent     # persistent | memory | none — see CLAUDE.md on 16GB RAM
  # Built by a volume-wise pre-pass (SRS-078). Decoding one volume takes ~1.7 s and
  # serves 128 frames, so a per-frame decode costs ~1.9 h per epoch against ~53 s for
  # the pre-pass. Per-fold size is 3.8-5.9 GB.
  #
  # RELATIVE, and it must stay relative. A committed configuration is shared by every
  # machine that checks out this repository, so an absolute path here would be one
  # laptop's filesystem asserted as everyone's. Override per machine with the
  # OCUVAL_CACHE_DIR environment variable, or --cache-dir; the resolved path is written
  # into run.json by SRS-031, so a run still records exactly where its cache was.
  #
  # On this workstation OCUVAL_CACHE_DIR points at D:, because the system volume had
  # 23 GB free against 3.8-5.9 GB per fold plus the 6.2 GB of derived DICOM already
  # moved there (docs/06 section 4.1). On Kaggle it would be /kaggle/temp (~57 GB,
  # ephemeral) rather than /kaggle/working (20 GB and counted as run output).
  cache_dir: artifacts/cache
  cache_rate: 0.2
  num_workers: 4

model:
  name: unet            # unet | segresnet
  in_channels: 1
  out_channels: 4       # background + IRF + SRF + PED
  channels: [32, 64, 128, 256, 512]
  strides: [2, 2, 2, 2]
  dropout: 0.2          # non-zero: required for MC-dropout at inference

loss:
  # SRS-084. The Dice term is MONAI's, untouched -- it never appeared in a fallback list,
  # and replacing working code would mean more to verify for nothing. The cross-entropy
  # term is written as log_softmax -> gather -> mean, each a deterministic CUDA kernel,
  # because MONAI's DiceCELoss reaches `nll_loss2d_forward_out_cuda_template`, the ONE
  # operation on this network with no deterministic implementation. Under
  # `use_deterministic_algorithms(True, warn_only=True)` torch quietly used the
  # non-deterministic kernel and warned 1308 times in the Stage 1 run (docs/13).
  #
  # It is a substitution, not an approximation: algebraically the same function as
  # nn.CrossEntropyLoss with mean reduction, no class weights and no ignored index,
  # differing only in floating-point summation order. TC-089 verifies it against the
  # reference for value and gradient, and asserts the reference warns where this does not.
  #
  # Measured cost of the substitution (2026-09-30, cirrus_holdout, 60 s windows):
  # -5.2% throughput at AMP off, -8.1% at AMP on. It buys ZERO fallbacks.
  name: dice_ce_deterministic
  include_background: false
  to_onehot_y: true
  softmax: true

optim:
  name: adamw
  lr: 0.0003
  weight_decay: 0.00001
  scheduler: cosine
  warmup_epochs: 5

train:
  epochs: 150
  # The EFFECTIVE batch: how many samples contribute to each optimiser step. This is the
  # number that defines the experiment, and it does not change with the hardware.
  batch_size: 8

  # How many samples pass through the accelerator at once (SRS-079). Must divide
  # batch_size exactly. Setting it below batch_size turns on gradient accumulation:
  # batch_size / micro_batch_size micro-batches are accumulated before each optimiser
  # step, so the effective batch is unchanged while peak activation memory falls roughly
  # in proportion. Equivalence holds because the network uses instance normalisation and
  # nothing couples samples within a batch -- see docs/07 section 14.
  #
  # 8 means no accumulation. Lower it to fit a smaller card.
  micro_batch_size: 8
  # ON since 2026-09-30, REVERSING the 2026-09-26 decision. That decision was not merely
  # outdated -- it was WRONG, because it was measured without the determinism the loop
  # requests, and so priced kernels no run selects (docs/13). The benchmark did not call
  # `request_determinism`; it does now.
  #
  # Measured under determinism (cirrus_holdout, 60 s windows, micro-batch 8):
  #   AMP off  9.2 img/s, peak 2.30 GiB      AMP on  17.1 img/s, peak 1.00 GiB
  # Without determinism the two are within 3% of each other (25.0 vs 24.3), which is what
  # the 2026-09-26 measurement saw and correctly reported for the run it measured.
  #
  # So AMP is 1.86x FASTER here and uses less than half the memory. Three folds at 150
  # epochs: 37.4 h with AMP against 57.7 h without (derived from the rates above plus the
  # 39 s/epoch overhead measured in Stage 1).
  #
  # WHY fp16 is faster on a card with no tensor cores is an UNMEASURED HYPOTHESIS: the
  # deterministic fp32 convolution-backward kernels appear to be far slower than their
  # fp16 counterparts, so determinism costs more in fp32 than the fp16 arithmetic penalty
  # costs. Kernel selection has not been profiled and this explanation is not evidence.
  # The decision rests on the throughput measurement, which does not depend on the reason.
  #
  # docs/07 section 15.6 pre-registers Stage 1b under these conditions; section 15
  # records Stage 1's own AMP-off conditions unchanged, because a pre-registration is not
  # edited after the fact.
  amp: true
  grad_clip: 1.0
  early_stopping_patience: 25
  val_interval: 1
  monitor: "val/dice_mean_foreground"
  monitor_mode: max

inference:
  mc_dropout_passes: 20

  # SRS-051: a fluid class counts as PRESENT in a volume when its predicted voxel count
  # exceeds this. Declared here and read by nothing else, because a threshold hard-coded in
  # the evaluator is a threshold nobody can see in the run record -- and this one moves
  # sensitivity and specificity directly, so it is exactly the kind of number that must be
  # fixed before results are visible (docs/07 section 17).
  #
  # 10 voxels. Chosen as a floor on "the model predicted something rather than nothing",
  # not tuned: at the native spacings here 10 voxels is ~1e-5 mm3, far below any clinically
  # meaningful volume, so it separates a handful of stray voxels from a genuine prediction
  # without being a decision about how much fluid matters. It is NOT selected on any split.
  presence_voxel_threshold: 10
  sliding_window_overlap: 0.25
