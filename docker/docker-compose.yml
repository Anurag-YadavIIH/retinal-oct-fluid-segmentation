services:
  orthanc:
    # Pinned by digest; see SOUP-014 in docs/04. Resolved 2026-09-17.
    image: orthancteam/orthanc:24.7.3@sha256:57a3d037729897331027ddc00c12695b50f1effbbf805f855396f3d0248d2d5f
    container_name: ocuval-orthanc
    ports:
      - "8042:8042"   # HTTP / DICOMweb
      - "4242:4242"   # DIMSE
    volumes:
      - ./orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
      - orthanc-db:/var/lib/orthanc/db
    environment:
      ORTHANC__NAME: OcuVal

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: ocuval-api
    ports:
      - "8000:8000"
    environment:
      OCUVAL_PACS_URL: http://orthanc:8042/dicom-web
    depends_on:
      - orthanc

volumes:
  orthanc-db:
