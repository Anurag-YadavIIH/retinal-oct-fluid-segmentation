name: Pages

# Publishes the report page (site/) to GitHub Pages, only after CI has passed on the same
# commit. CI runs TC-130 and TC-131, which check that the committed page renders from the
# committed data and carries no image data or identifier (SRS-092).
#
# The page is NOT built here. scripts/08_build_site.py needs the evaluation records, which never
# leave the workstation (docs/06 section 7.1), so the page and its data are generated there and
# committed. This workflow adds only the static fallback figures, copied from docs/figures, so
# they are not committed twice.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    # Pinned for the same reason as CI (.github/workflows/ci.yml): no silent runner change.
    runs-on: ubuntu-24.04
    steps:
      # Pinned by commit SHA, release tag in the comment, as in ci.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Deploy exactly the commit CI passed, not whatever main points at by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Assemble the page and its fallback figures
        run: |
          mkdir -p _site/figures
          cp site/index.html site/style.css site/app.js _site/
          cp -r site/data _site/data
          cp docs/figures/fig1_training_curves.png docs/figures/fig2_dice_intervals.svg \
             docs/figures/fig3_predicted_voxels.png docs/figures/fig4_dice_differences.svg \
             docs/figures/fig5_per_volume_dice.png _site/figures/
          # The illustrative B-scans (docs/07 section 21), approved by the author 2026-10-14.
          cp docs/figures/bscan_worst.png docs/figures/bscan_median.png \
             docs/figures/bscan_best.png docs/figures/bscan_fp_irf.png \
             docs/figures/bscan_fp_srf.png docs/figures/bscan_fp_ped.png _site/figures/
          find _site -type f | sort

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
