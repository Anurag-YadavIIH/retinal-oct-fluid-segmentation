name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    # Pinned, not ubuntu-latest: that label moves to Ubuntu 26 from 2026-10-19, and the
    # lock is verified on this image (TC-099). The runner changes only by a recorded
    # decision in docs/13, never by a label moving underneath it.
    runs-on: ubuntu-24.04
    steps:
      # Actions are pinned by commit SHA, with the release tag as a comment: a tag can be
      # moved, a SHA cannot. Updated only by a recorded decision (docs/13).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # TC-108 checks that every commit SHA cited in the documents still resolves
          # to a commit reachable from main. actions/checkout defaults to fetch-depth 1,
          # which leaves a single commit and makes every citation look dangling. The
          # check is only meaningful against real history, so fetch all of it. This
          # repository is small; the cost is negligible.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      # Installs from the lock, not from pyproject.toml, so CI runs the recorded
      # environment rather than whatever the resolver picks today. pyproject pins direct
      # dependencies only; every transitive one floated, which is how this repository's
      # CI and its development workstation came to differ without either changing
      # (docs/13, 2026-09-28).
      #
      # torch comes from the PyTorch CPU index, NOT from PyPI. CI runs tests, not
      # training, and the runner has no GPU. PyPI's Linux torch wheel is the CUDA build
      # and pulls eleven nvidia-*-cu12 packages that the lock does not carry -- the lock
      # was generated on Windows, where torch requires mkl instead and those eleven are
      # not installed. Taking torch from the CPU index removes them entirely, so the
      # lock installs cleanly on Linux without listing platform-specific CUDA packages
      # this machine has never resolved.
      #
      # The result is torch==2.3.1+cpu here against 2.3.1+cu121 on the training
      # workstation. Both are recorded build variants of the locked 2.3.1, handled the
      # same way by tests/test_environment_lock.py (TC-099) and documented in docs/04
      # section 4.1.
      #
      # --no-deps on the editable install: the lock has already resolved everything, and
      # letting pip re-resolve would defeat the point of having one.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.3.1"
          pip install -r requirements.lock
          pip install -e ".[dev]" --no-deps

      - name: Record the environment
        run: |
          python -c "import torch; print('torch', torch.__version__, 'cuda', torch.cuda.is_available())"
          python -m pip freeze

      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      # Data- and PACS-dependent tests are excluded: CI has neither RETOUCH
      # nor a running Orthanc instance. The leakage gate (TC-004) is NOT in
      # those groups and must always run here. See CLAUDE.md rule 2.
      - name: Test
        run: pytest -m "not requires_data and not requires_pacs"

  pacs:
    # SRS-094: the PACS round-trip (TC-080..TC-082) against an Orthanc that exists only for
    # this job. docs/06 section 7.2.1 permits objects to leave the local Orthanc instance for
    # this destination alone, and only under the conditions below; TC-135 checks each of them
    # in this file. Change one and the amendment no longer covers the job.
    #   - the image is the SOUP-014 digest, configured from docker/orthanc/orthanc.json;
    #   - port 8042 is published on loopback only, and no other port is published;
    #   - the tests send synthetic objects only (tests/test_dicomweb_roundtrip.py), and
    #     nothing in CI holds or downloads RETOUCH data;
    #   - no artifact is uploaded;
    #   - the container is removed whether or not the tests pass, and the runner is a fresh
    #     virtual machine per job.
    # It gates CI like the quality job, so a failure here fails the run.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      # The same install as the quality job, for the same reasons (see there).
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.3.1"
          pip install -r requirements.lock
          pip install -e ".[dev]" --no-deps

      # Started after checkout, not as a services: container, so it can mount the same
      # orthanc.json the local docker compose setup uses.
      - name: Start Orthanc
        run: |
          docker run -d --name ocuval-orthanc \
            -p 127.0.0.1:8042:8042 \
            -v "$PWD/docker/orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro" \
            orthancteam/orthanc:24.7.3@sha256:57a3d037729897331027ddc00c12695b50f1effbbf805f855396f3d0248d2d5f

      # Fails the job here, not in every test, if Orthanc or its DICOMweb plugin is absent.
      - name: Wait for Orthanc and its DICOMweb endpoint
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8042/system > /dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8042/system
          echo
          curl -fsS -o /dev/null -w "GET /dicom-web/studies: %{http_code}\n" \
            http://127.0.0.1:8042/dicom-web/studies

      - name: PACS round-trip
        env:
          OCUVAL_PACS_URL: http://127.0.0.1:8042/dicom-web
        run: pytest -m requires_pacs

      - name: Orthanc log, then remove the container
        if: always()
        run: |
          docker logs ocuval-orthanc || true
          docker rm -f ocuval-orthanc
