[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocuval"
version = "0.1.0"
description = "DICOM-native retinal OCT fluid segmentation with cross-vendor validation and IEC 62304-aligned documentation"
readme = "README.md"
requires-python = "==3.11.*"
license = { text = "MIT" }
authors = [{ name = "Anurag Yadav" }]

# Every pin here must have a matching entry in docs/04_soup_list.md.
dependencies = [
    "numpy==1.26.4",
    "scipy==1.13.1",
    "pandas==2.2.2",
    "pyyaml==6.0.2",
    "pydicom==2.4.4",
    "highdicom==0.22.0",
    "SimpleITK==2.3.1",
    "torch==2.3.1",
    "monai==1.3.2",
    "scikit-learn==1.5.1",
    "requests==2.32.3",
    "fastapi==0.111.1",
    "uvicorn==0.30.3",
    "python-multipart==0.0.31",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.2",
    "pytest-cov==5.0.0",
    "ruff==0.5.7",
    "pre-commit==3.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=ocuval --cov-report=term-missing"
markers = [
    "slow: tests that take more than a few seconds",
    "requires_data: tests that need RETOUCH data present under data/",
    "requires_pacs: tests that need the Orthanc container running",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.per-file-ignores]
# Test functions carry their TC identifier in the name (see CLAUDE.md section 3).
# The uppercase is deliberate and traceability depends on it.
"tests/*" = ["N802"]

[tool.coverage.run]
branch = true
source = ["src/ocuval"]
